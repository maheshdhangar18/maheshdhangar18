      .bar { fill: #161b22; }
      .dot-r { fill: #ff5f56; }
      .dot-y { fill: #ffbd2e; }
      .dot-g { fill: #27c93f; }
      .title { fill: #8b949e; font-family: monospace; font-size: 13px; }
      .term-text { font-family: "Courier New", Courier, monospace; font-size: 13px; }
      .c-green { fill: #7ee787; font-weight: bold; }
      .c-blue { fill: #58a6ff; font-weight: bold; }
      .c-purple { fill: #d2a8ff; font-weight: bold; }
      .c-yellow { fill: #f2cc60; }
      .c-gray { fill: #8b949e; }
      .c-white { fill: #e6edf3; }
      .prompt { fill: #39d353; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
