  <circle class="dot-y" cx="44" cy="20" r="6"/>
  <circle class="dot-g" cx="64" cy="20" r="6"/>
  <text class="title" x="225" y="24" text-anchor="middle">mahesh@terminal:~ (portrait.ascii)</text>

